# FoodFlow Backend - Nginx Reverse Proxy Configuration
# Target server: http://127.0.0.1:5000

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com; # Replace with your actual domain or EC2 Public DNS/IP

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API Requests to Node.js / Express backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Header forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests (e.g., AI manifest processing)
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Max body size (e.g., for photo upload parsing)
        client_max_body_size 15M;
    }

    # Certbot challenge directory (managed automatically by certbot)
    location ~ /\.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }
}
